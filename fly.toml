primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/agent_black_hole.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "agent_black_hole_data"
  destination = "/data"

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
